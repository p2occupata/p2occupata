<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.meta_description | default: page.descrizione | default: site.description | escape }}">
    <title>{% if page.titolo %}{{ page.titolo | escape }} | {{ site.title | escape }}{% else %}{{ page.title | default: site.title | escape }}{% endif %}</title>
    <link rel="icon" type="image/png" href="{{ '/images/logo.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..800;1,400..800&family=Anton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/tokens.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/componenti.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/sito.css' | relative_url }}">
</head>
<body>
    <a class="salta" href="#contenuto">Vai al contenuto</a>

    <nav class="navigazione" aria-label="Navigazione principale">
        <div class="contenitore navigazione-interno">
            <a class="navigazione-marchio" href="{{ '/' | relative_url }}#inizio" aria-label="Aula P2.0 Occupata, torna all'inizio">
                <img src="{{ '/images/logo.png' | relative_url }}" alt="" width="80" height="51">
            </a>
            <button class="navigazione-apri" type="button" aria-label="Apri il menu" aria-controls="navigazione-voci" aria-expanded="false">
                <span></span><span></span>
            </button>
            <div class="navigazione-voci" id="navigazione-voci">
                <a href="{{ '/' | relative_url }}#vieni">Vieni in aula</a>
                <a href="{{ '/' | relative_url }}#cosa-facciamo">La vita in P2.0</a>
                <a href="{{ '/' | relative_url }}#storia">La storia</a>
                <a href="{{ '/eventi/' | relative_url }}"{% if page.url == '/eventi/' %} aria-current="page"{% endif %}>Eventi</a>
                <a class="bottone bottone--piccolo" href="{{ '/' | relative_url }}#partecipa">Partecipa</a>
            </div>
        </div>
    </nav>

    <div id="contenuto">{{ content }}</div>

    <footer class="piede">
        <div class="contenitore">
            <div class="piede-interno">
                <div>
                    <img src="{{ '/images/logo.png' | relative_url }}" alt="Aula P2.0 Occupata" width="128" height="82">
                    <p>Uno spazio autogestito all'Università della Calabria.</p>
                </div>
                <ul class="piede-link">
                    <li><a href="https://maps.app.goo.gl/3ZutjPXAodVsWJPg7" target="_blank" rel="noopener noreferrer">Dove siamo</a></li>
                    <li><a href="https://t.me/aulap2punto0community" target="_blank" rel="noopener noreferrer">Telegram</a></li>
                    <li><a href="https://www.instagram.com/aulap2.0occupata/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
                </ul>
            </div>
            <p class="piede-fondo">Aula P2.0 Occupata. Fatto per essere usato, condiviso e vissuto.</p>
        </div>
    </footer>

    <script src="{{ '/assets/navigazione.js' | relative_url }}"></script>
    <script src="{{ '/assets/eventi.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
