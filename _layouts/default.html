<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.meta_description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    <link rel="icon" type="image/png" href="{{ '/images/logo.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#contenuto">Vai al contenuto</a>
    <nav class="site-nav" aria-label="Navigazione principale">
        <div class="container nav-inner">
            <a class="brand" href="{{ '/' | relative_url }}#inizio" aria-label="Aula P2.0 Occupata, torna all'inizio">
                <img src="{{ '/images/logo.png' | relative_url }}" alt="" width="86" height="55">
            </a>
            <button class="menu-toggle" type="button" aria-label="Apri il menu" aria-controls="nav-links" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="nav-links">
                <a href="{{ '/' | relative_url }}#vieni">Vieni in aula</a>
                <a href="{{ '/' | relative_url }}#cosa-facciamo">La vita in P2.0</a>
                <a href="{{ '/' | relative_url }}#storia">La storia</a>
                <a href="{{ '/' | relative_url }}#eventi">Eventi</a>
                <a class="nav-participate" href="{{ '/' | relative_url }}#partecipa">Partecipa ↗</a>
            </div>
        </div>
    </nav>

    <div id="contenuto">{{ content }}</div>

    <footer class="site-footer">
        <div class="container footer-inner">
            <div>
                <img src="{{ '/images/logo.png' | relative_url }}" alt="Aula P2.0 Occupata" width="120" height="77">
                <p>Uno spazio autogestito all'Università della Calabria.</p>
            </div>
            <div class="footer-links">
                <a href="https://maps.app.goo.gl/3ZutjPXAodVsWJPg7" target="_blank" rel="noopener noreferrer">Dove siamo ↗</a>
                <a href="https://t.me/aulap2punto0community" target="_blank" rel="noopener noreferrer">Telegram ↗</a>
                <a href="https://www.instagram.com/aulap2.0occupata/" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
            </div>
        </div>
        <div class="container footer-bottom">Aula P2.0 Occupata · Fatto per essere usato, condiviso e vissuto.</div>
    </footer>

    <script>
        const menuButton = document.querySelector('.menu-toggle');
        const menuLinks = document.querySelector('.nav-links');

        if (menuButton && menuLinks) {
            const closeMenu = () => {
                menuButton.setAttribute('aria-expanded', 'false');
                menuButton.setAttribute('aria-label', 'Apri il menu');
                menuLinks.classList.remove('is-open');
            };

            menuButton.addEventListener('click', () => {
                const isOpen = menuButton.getAttribute('aria-expanded') === 'true';
                menuButton.setAttribute('aria-expanded', String(!isOpen));
                menuButton.setAttribute('aria-label', isOpen ? 'Apri il menu' : 'Chiudi il menu');
                menuLinks.classList.toggle('is-open', !isOpen);
            });

            menuLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', closeMenu));
            document.addEventListener('keydown', event => {
                if (event.key === 'Escape') closeMenu();
            });
        }
    </script>
</body>
</html>
